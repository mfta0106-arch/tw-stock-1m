name: Pullback Backtest 1m

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD"
        required: true
        default: "2026-08-19"

      end:
        description: "End date YYYY-MM-DD"
        required: true
        default: "2026-09-18"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run pullback backtest
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          python pullback_backtest.py \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}"

      - name: Commit results
        run: |
          git config user.name "stock-data-bot"
          git config user.email "stock-data-bot@users.noreply.github.com"

          git add data/ backtests/

          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi

          git commit -m "Pullback backtest ${{ inputs.start }} to ${{ inputs.end }}"
          git push
