name: Fetch Taiwan Stock 1m

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Trading date YYYY-MM-DD"
        required: true
        default: "2026-09-18"

      symbols:
        description: "Stock symbols separated by commas"
        required: true
        default: "2344"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch 1-minute candles
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          python fetch_1m.py \
            --date "${{ inputs.date }}" \
            --symbols "${{ inputs.symbols }}"

      - name: Commit data
        run: |
          git config user.name "stock-data-bot"
          git config user.email "stock-data-bot@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi

          git commit -m "Add 1m data ${{ inputs.date }}"
          git push
