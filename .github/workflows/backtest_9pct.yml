name: Backtest 9pct

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests pandas

      - name: Run backtest
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: python backtest_9pct.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-9pct-results
          path: |
            backtest_9pct_summary.csv
            backtest_9pct_events.csv
